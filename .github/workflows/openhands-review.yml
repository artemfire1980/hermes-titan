name: PR Review by OpenHands

on:
  pull_request_target:
    types: [opened, ready_for_review, labeled, review_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-review:
    permissions:
      contents: read
      pull-requests: write
      issues: write

    if: |
      (github.event.action == 'opened' && github.event.pull_request.draft == false) ||
      github.event.action == 'ready_for_review' ||
      github.event.label.name == 'review-this' ||
      github.event.requested_reviewer.login == 'openhands-agent'

    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run OpenHands PR Review
        uses: OpenHands/extensions/plugins/pr-review@main
        with:
          llm-model: openai/nvidia/nemotron-3-ultra-550b-a55b
          llm-base-url: https://integrate.api.nvidia.com/v1
          llm-api-key: ${{ secrets.NVIDIA_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openhands-sdk-package: openhands-sdk>=1.22.0
