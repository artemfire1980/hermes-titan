name: OpenHands Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Номер Pull Request (для ручного запуска)'
        required: false
        default: '1'

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Prompt File
        run: |
          echo "Пожалуйста, проверь этот Pull Request на наличие багов и предложи улучшения." > prompt.txt

      - name: Run OpenHands
        run: |
          docker run --rm \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/github/workspace:rw" \
            -w /github/workspace \
            -e LLM_MODEL="openai/nvidia/nemotron-3-ultra-550b-a55b" \
            -e LLM_BASE_URL="https://integrate.api.nvidia.com/v1" \
            -e LLM_API_KEY="${{ secrets.NVIDIA_API_KEY }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e DISABLE_SECURITY_RISK=true \
            -e SANDBOX_VOLUMES="/github/workspace:/workspace:rw" \
            -e WORKSPACE_DIR="/github/workspace" \
            ghcr.io/all-hands-ai/openhands:latest \
            bash -c "apt-get update && apt-get install -y git && python -m openhands.resolver.resolve_issue --selected-repo ${{ github.repository }} --issue-number ${{ github.event.pull_request.number || github.event.inputs.pr_number }} --issue-type pr --username artemfire1980 --token ${{ secrets.GITHUB_TOKEN }} --prompt-file /github/workspace/prompt.txt"
