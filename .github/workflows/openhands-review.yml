name: AI PR Review (Nemotron via NVIDIA API)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Получить diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            curl -sS -f \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3.diff" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUM" \
              -o pr.diff
          else
            curl -sS -f \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3.diff" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}" \
              -o pr.diff
          fi
          wc -c pr.diff

      - name: Ревью моделью и публикация
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_BASE_URL: https://integrate.api.nvidia.com/v1
          LLM_MODEL: nvidia/nemotron-3-ultra-550b-a55b
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          PR_URL: ${{ github.event.pull_request.html_url || format('https://github.com/{0}/commit/{1}', github.repository, github.sha) }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          MAX_CHARS = 120_000
          diff = open("pr.diff", encoding="utf-8", errors="replace").read()
          truncated = len(diff) > MAX_CHARS
          diff = diff[:MAX_CHARS]

          system = (
              "Ты строгий, но доброжелательный senior-ревьюер. Проверяй баги, "
              "безопасность, обработку ошибок, граничные случаи и читаемость. "
              "Отвечай по-русски, списком конкретных замечаний с указанием "
              "файла и строки. Если замечаний нет, так и скажи. Не выдумывай."
          )
          user = f"PR/Commit: {os.environ['PR_TITLE']}\n\n```diff\n{diff}\n```"
          if truncated:
              user += "\n\n(diff обрезан по лимиту)"

          def call(url, payload, headers):
              req = urllib.request.Request(
                  url, data=json.dumps(payload).encode(), headers=headers)
              with urllib.request.urlopen(req, timeout=600) as r:
                  return json.load(r)

          resp = call(
              os.environ["LLM_BASE_URL"] + "/chat/completions",
              {"model": os.environ["LLM_MODEL"],
               "messages": [{"role": "system", "content": system},
                            {"role": "user", "content": user}],
               "temperature": 0.2, "max_tokens": 4096},
              {"Authorization": "Bearer " + os.environ["NVIDIA_API_KEY"],
               "Content-Type": "application/json"})
          review = resp["choices"][0]["message"]["content"]

          if os.environ.get("PR") and os.environ["PR"].isdigit():
              call(
                  f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR']}/comments",
                  {"body": "## 🤖 AI-ревью\n\n" + review},
                  {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                   "Accept": "application/vnd.github+json",
                   "Content-Type": "application/json"})
          PY
