name: OpenHands Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OpenHands Docker
        uses: docker://ghcr.io/all-hands-ai/openhands:latest
        env:
          LLM_MODEL: "openai/nemotron-3-super-120b-a12b"
          LLM_BASE_URL: "https://khadas.taila31870.ts.net/v1"
          LLM_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENHANDS_REPO: ${{ github.repository }}
          OPENHANDS_PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          args: >
            python -m openhands.resolver.resolve_issue
            --repo ${{ github.repository }}
            --issue-number ${{ github.event.pull_request.number }}
            --comment "Пожалуйста, проверь этот Pull Request на наличие багов и предложи улучшения."
