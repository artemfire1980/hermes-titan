# Ruff config для Hermes-Titan
line-length = 100
target-version = "py312"

[lint.per-file-ignores]
"tests/*.py" = [
    "TRY002", "TRY003", "S101", "BLE001", "TRY301", "TRY400",
    "F841", "B017", "TRY004", "RUF012", "RUF059",
]
"scripts/*.py" = [
    "BLE001",  # except Exception — graceful degradation
    "E722",    # bare except — техдолг, чиним в отдельном CP
    "S110",    # try-except-pass — graceful degradation
    "S112",    # try-except-continue
    "S101",    # assert
    "DTZ005",  # datetime.now() без tz — техдолг
    "DTZ006",  # datetime.fromtimestamp() без tz — техдолг
    "RUF012",  # mutable class attr — техдолг
    "TRY002",  # кастомные исключения
    "TRY003",  # длинные сообщения
    "TRY004",  # TypeError vs ValueError
    "SIM102",  # nested if
    "SIM115",  # open без with
    "SIM118",  # in dict.keys()
    "C401",    # set comprehension
    "UP022",   # capture_output
    "ASYNC230",# open в async
    "F841",    # unused variable
]
